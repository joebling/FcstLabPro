{% extends "base.html" %}
{% block content %}

{% if not models %}
  <div class="bg-white rounded-lg border border-slate-200 p-8 text-center text-slate-500">
    暂无模型数据。请先运行 <code class="bg-slate-100 px-1 rounded">scripts/build_performance.py</code>。
  </div>
{% else %}
  <!-- 模型切换 -->
  <div class="mb-4 flex items-center gap-3">
    <label class="text-sm font-medium text-slate-600">模型</label>
    <select name="model"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-sm bg-white
                   focus:ring-2 focus:ring-wmblue focus:border-wmblue"
            hx-get="/partial/model" hx-target="#model-view" hx-swap="innerHTML">
      {% for m in models %}
      <option value="{{ m }}" {{ 'selected' if m == active_model else '' }}>{{ m }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="model-view">
    {% include "partials/model_view.html" %}
  </div>
{% endif %}

{% endblock %}
