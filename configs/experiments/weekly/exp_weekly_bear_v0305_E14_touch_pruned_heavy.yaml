experiment:
  name: v0305_E14_touch_pruned_heavy
  description: 'v0305 E14: E8 + 特征深度精简 (删除 importance≤3, 129→81)'
  tags:
  - weekly
  - bear
  - v0305
  - touch_label
  - decontamination
  - feature_pruning
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  drop_na_method: ffill_then_drop
  scaling: standard
  drop_features:
  # E8 去污染
  - rsi_*
  - price_vs_sma_*
  - sma_cross_10_50
  - sma_cross_50_200
  # E14 深度精简: importance ≤ 3
  - avg_trade_size
  - avg_trade_size_ma_10
  - avg_trade_size_ma_20
  - avg_trade_size_ma_5
  - avg_trade_size_ratio_10
  - avg_trade_size_ratio_20
  - avg_trade_size_ratio_5
  - avg_trade_size_sma_20
  - bb_lower_20
  - bb_upper_20
  - buy_pressure
  - ema_10
  - ema_20
  - ema_5
  - ema_50
  - ext_fgi_change_7d
  - ext_fgi_extreme_fear
  - ext_fgi_extreme_greed
  - flow_change_10d
  - flow_change_1d
  - flow_change_3d
  - flow_change_5d
  - flow_price_divergence_20
  - open_interest_14
  - open_interest_24
  - open_interest_7
  - qvol_ratio_10
  - qvol_ratio_20
  - qvol_ratio_5
  - qvol_sma_10
  - qvol_sma_5
  - return_7d
  - sma_10
  - sma_100
  - sma_20
  - sma_5
  - sma_50
  - trades_change_1d
  - trades_ratio_10
  - vol_change_1d
  - vol_ratio_10
  - vol_ratio_20
  - vol_ratio_50
  - volume_density
  - volume_density_ma_10
  - volume_density_ma_5
  - vwap_10
  - vwap_20
label:
  strategy: touch_filtered
  T: 21
  X: 0.04
  rsi_window: 14
  rsi_threshold: 45.0
  ma_window: 50
  require_below_ma: true
model:
  type: lightgbm
  params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    verbose: -1
    n_jobs: 1
    auto_scale_pos_weight: true
evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - cohen_kappa
  purge_gap: 21
seed: 42
