# ============================================================
# Bear Pump+Dump v0302
#
# 预测"先涨后跌"的倒V型反转信号（看空）
# 与 bear_dip_recovery 保持相同超参，仅改 label.strategy
# ============================================================

experiment:
  name: weekly_bear_v0302_pump_dump
  category: weekly
  description: "v0302 Bear pump_dump: 预测先涨后跌的倒V反转"
  tags:
    - weekly
    - bear
    - v0302
    - pump_dump

data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  path: data/raw/btc_binance_BTCUSDT_1d.csv

features:
  sets:
    - technical
    - volume
    - flow
    - market_structure
    - external_fgi
  drop_na_method: ffill_then_drop
  scaling: null

label:
  strategy: pump_dump
  T: 28
  pump_threshold: 0.05
  dump_threshold: 0.03

model:
  type: orion_bix
  params:
    n_estimators: 16
    n_jobs: 1
    random_state: 42

evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 42
  purge_gap: 21
  metrics:
    - accuracy
    - f1_binary
    - precision_binary
    - recall_binary
    - cohen_kappa

seed: 42
