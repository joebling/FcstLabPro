experiment:
  name: weekly_bear_v0305_E8_touch_label
  description: 'v0305 E8: touch_filtered 标签 (路径依赖, 对标 E1 参数)'
  tags:
  - weekly
  - bear
  - v0305
  - touch_label
  - decontamination
  - label_alignment
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  drop_na_method: ffill_then_drop
  scaling: standard
  drop_features:
  - rsi_*              # 去污染: rsi_6, rsi_14, rsi_28 + lag/rolling 衍生
  - price_vs_sma_*     # 去污染: price_vs_sma_20, price_vs_sma_50, price_vs_sma_200
  - sma_cross_10_50    # 涉及 sma_50
  - sma_cross_50_200   # 涉及 sma_50
label:
  strategy: touch_filtered
  T: 21
  X: 0.04
  rsi_window: 14
  rsi_threshold: 45.0
  ma_window: 50
  require_below_ma: true
model:
  type: lightgbm
  params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    verbose: -1
    n_jobs: 1
    auto_scale_pos_weight: true
evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - cohen_kappa
  purge_gap: 21
seed: 42
