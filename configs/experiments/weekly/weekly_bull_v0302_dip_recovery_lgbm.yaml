experiment:
  name: weekly_bull_v0302_dip_recovery_lgbm
  description: 'v0302 Label 实验: dip_recovery - 使用 LightGBM'
  tags:
  - weekly
  - bull
  - v0302
  - dip_recovery
  - lgbm
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  - regime
  drop_na_method: ffill_then_drop
  scaling: standard
label:
  strategy: dip_recovery
  T: 21
model:
  type: lgbm
  params:
    n_estimators: 16
    random_state: 42
    verbose: -1
evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - cohen_kappa
  purge_gap: 21
seed: 42
