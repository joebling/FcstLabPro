# Bull dip_recovery v0302 — 重跑（修复 future_low bug）
experiment:
  name: weekly_bull_v0302_dip_recovery
  category: weekly
  description: "v0302 Label 实验: dip_recovery"
  tags:
    - weekly
    - bull
    - v0302
    - dip_recovery

data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  path: data/raw/btc_binance_BTCUSDT_1d.csv

features:
  sets:
    - technical
    - volume
    - flow
    - market_structure
    - external_fgi
    - regime
  drop_na_method: ffill_then_drop
  scaling: standard

label:
  strategy: dip_recovery
  T: 21

model:
  type: orion_bix
  params:
    n_estimators: 16
    n_jobs: 1
    random_state: 42

evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 21
  purge_gap: 21
  metrics:
    - accuracy
    - f1_binary
    - precision_binary
    - recall_binary
    - cohen_kappa

seed: 42
