experiment:
  name: weekly_bear_v26_tabpfn
  description: 'Bear v26: TabPFN 模型实验 - T=28 + FGI'
  tags:
  - weekly
  - bear
  - binary
  - v26
  - tabpfn
  - lightweight
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  drop_na_method: ffill_then_drop
  scaling: standard
label:
  strategy: reversal
  T: 28
  X: 0.05
  map:
    0: 1
    1: 0
    2: 0
model:
  type: tabpfn
  params:
    n_estimators: 16
    balance_probabilities: true
    random_state: 42
evaluation:
  method: walk_forward
  init_train: 1500
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - f1_macro
  - cohen_kappa
seed: 42
