experiment:
  name: weekly_bear_v28_orion_X10
  description: 'Bear v28: Orion-BiX X=0.10 实验 - 更高阈值减少正类样本但信号更强'
  tags:
  - weekly
  - bear
  - binary
  - v28
  - orion
  - X10
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  drop_na_method: ffill_then_drop
  scaling: standard
label:
  strategy: reversal
  T: 28
  X: 0.10
  map:
    0: 1
    1: 0
    2: 0
model:
  type: orion_bix
  params:
    n_estimators: 16
    random_state: 42
evaluation:
  method: walk_forward
  init_train: 1500
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - f1_macro
  - cohen_kappa
seed: 42
