experiment:
  name: weekly_bull_v22_gru
  description: 'Bull v22: GRU 时间序列分类实验'
  tags:
  - weekly
  - bull
  - binary
  - v22
  - gru
  - deep_learning
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  - regime
  drop_na_method: ffill_then_drop
  scaling: standard
label:
  strategy: reversal
  T: 21
  X: 0.05
  map:
    0: 0
    1: 0
    2: 1
model:
  type: gru_classifier
  params:
    hidden_dim: 32
    num_layers: 1
    epochs: 20
    batch_size: 32
    learning_rate: 0.001
    sequence_length: 21
    dropout: 0
    random_state: 42
evaluation:
  method: walk_forward
  init_train: 1500
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - f1_macro
  - cohen_kappa
seed: 42
