experiment:
  name: weekly_bull_v27_orion_v4_extended_oos
  description: 'Bull v27: 扩展 OOS 实验 - 缩短训练集以扩展测试集样本'
  tags:
  - weekly
  - bull
  - binary
  - v27
  - orion
  - extended_oos
  - v4
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  - regime
  drop_na_method: ffill_then_drop
  scaling: standard
label:
  strategy: reversal
  T: 21
  X: 0.05
  map:
    0: 0
    1: 0
    2: 1
model:
  type: orion_bix
  params:
    n_estimators: 16
    random_state: 42
evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - f1_macro
  - cohen_kappa
seed: 42
