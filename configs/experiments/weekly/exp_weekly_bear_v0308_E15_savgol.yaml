# =============================================================
# A/B 实验: Savitzky-Golay 平滑 vs 原始数据
# 基于 E8 touch_label 配置, 添加 SG 平滑预处理
# 灵感来源: arXiv:2506.05764v2 (Wang, 2025)
# =============================================================
experiment:
  name: weekly_bear_v0308_E15_savgol
  description: 'v0308 E15: 基于 E8 + Savitzky-Golay 平滑 (window=11, poly=3)'
  tags:
  - weekly
  - bear
  - v0308
  - savgol
  - smoothing
  - paper_2506_05764
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  drop_na_method: ffill_then_drop
  scaling: standard
  drop_features:
  - rsi_*
  - price_vs_sma_*
  - sma_cross_10_50
  - sma_cross_50_200
  # ====== 新增: 平滑配置 ======
  smoothing:
    method: savgol
    window: 11            # 日频数据用较小窗口 (论文用 21 但那是 100ms 分辨率)
    polyorder: 3
    columns: ["close", "high", "low", "volume"]
label:
  strategy: touch_filtered
  T: 21
  X: 0.04
  rsi_window: 14
  rsi_threshold: 45.0
  ma_window: 50
  require_below_ma: true
model:
  type: lightgbm
  params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    verbose: -1
    n_jobs: 1
    auto_scale_pos_weight: true
evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - cohen_kappa
  purge_gap: 21
seed: 42
