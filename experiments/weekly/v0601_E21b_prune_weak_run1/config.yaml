experiment:
  name: v0601_E21b_prune_weak
  description: 'Phase 2.5 Wave 2 (E8 系剪枝): imp<5 删'
  tags:
  - weekly
  - bear
  - v0601
  - phase_2_5
  - wave_2
  - e21
  - prune
  - touch
  category: weekly
  hypothesis: '验证 E20 剪枝规律在 E8 (touch_filtered, kappa 0.757 已较高) 是否普适.

    镜像 E20b (E1 +2.5%).

    若 E21c 同样有显著提升 → "剪枝>加特征" 是 weekly 任务通用规律.

    若 E21c 持平或下降 → E8 已接近 touch 任务上限, 规律仅在 E1 系成立.'
