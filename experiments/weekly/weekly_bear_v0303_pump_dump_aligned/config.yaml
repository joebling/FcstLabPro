experiment:
  name: weekly_bear_v0303_pump_dump_aligned
  description: Bear Pump Dump - 全对齐 Bull 配置
  tags:
  - weekly
  - bear
  - v0303
  - pump_dump
  - aligned
  category: weekly
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  - volume
  - flow
  - market_structure
  - external_fgi
  - regime
  drop_na_method: ffill_then_drop
  scaling: standard
label:
  strategy: pump_dump
  T: 21
  X: 0.08
model:
  type: orion_bix
  params:
    n_estimators: 16
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    verbose: -1
evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 21
  metrics:
  - accuracy
  - f1_binary
  - precision_binary
  - recall_binary
  - cohen_kappa
  purge_gap: 21
seed: 42
