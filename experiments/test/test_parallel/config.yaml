experiment:
  name: test_parallel
  description: 并行执行测试
  tags: []
  category: test
data:
  source: binance
  symbol: BTCUSDT
  interval: 1d
  start: '2018-01-01'
  end: '2025-12-31'
  path: data/raw/btc_binance_BTCUSDT_1d.csv
features:
  sets:
  - technical
  drop_na_method: ffill_then_drop
  scaling: standard
label:
  strategy: directional
  T: 14
  X: 0.08
  map:
    0: 0
    1: 0
    2: 1
model:
  type: lightgbm
  params:
    n_estimators: 10
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    verbose: -1
    n_jobs: 1
evaluation:
  method: walk_forward
  init_train: 800
  oos_window: 63
  step: 42
  metrics:
  - accuracy
  - f1_binary
  parallel_workers: 4
  purge_gap: 0
seed: 42
